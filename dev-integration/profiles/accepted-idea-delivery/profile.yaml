schema_version: 1
profile_id: accepted-idea-delivery
lane_class: governed-devint
summary: Persistent local-k3s dev-integration workbench for the accepted-idea delivery broker and OpenProject ART operator surfaces.
runtime:
  platform: local-k3s
  state_model: persistent
  namespace_pattern: devint-{profile}-{operator}
  state_root_template: .dev-integration/{profile}/{operator}
  components:
    - openproject
    - operator-orchestration-service
    - operator-orchestration-service-workflow-worker
    - delivery-art-seeding
testing:
  smoke:
    mutation_mode: read-only
    companion_profile_id: accepted-idea-delivery-mutation-smoke
source_repos:
  - repo: operator-orchestration-service
    purpose: Broker source mount for accepted-idea delivery workbench reads, ART workflow updates, and operator access.
  - repo: platform-engineering
    purpose: Reuse the canonical OpenProject backlog, delivery-project, and admin surface material.
host_services:
  - id: delivery-art-view-sync
    command: dev-integration/profiles/accepted-idea-delivery/scripts/reconcile_delivery_art_views_loop.sh
    readiness:
      mode: command
      command: dev-integration/profiles/accepted-idea-delivery/scripts/reconcile_delivery_art_views_ready.sh
      timeout_seconds: 210
      interval_seconds: 2
      probe_timeout_seconds: 5
commands:
  up: dev-integration/profiles/accepted-idea-delivery/scripts/up.sh
  status: dev-integration/profiles/accepted-idea-delivery/scripts/status.sh
  access: dev-integration/profiles/accepted-idea-delivery/scripts/access.sh
  smoke: dev-integration/profiles/accepted-idea-delivery/scripts/smoke.sh
  down: dev-integration/profiles/accepted-idea-delivery/scripts/down.sh
  reset: dev-integration/profiles/accepted-idea-delivery/scripts/reset.sh
  promote_check: dev-integration/profiles/accepted-idea-delivery/scripts/promote-check.sh
session:
  required_artifacts:
    - openproject-backlog.json
    - openproject-delivery-art.json
    - openproject-identity.json
    - openproject-api-token.txt
    - broker.env
    - smoke-summary.txt
    - promotion-report.yaml
stage_handoff:
  owner_repo: platform-engineering
  governed_surface: openproject-stage-delivery-art-workbench
  required_checks:
    - broker readiness
    - composed Work Design dependency and caller binding readiness
    - durable orchestration definition catalog and zero-replica worker
    - proposal backlog list read
    - delivery artifact mutation draft workflow
    - WGCF ART readiness is required for broker completion-style mutations
    - optimized ART packet reads
    - landing-unit closeout evidence read
    - proposal project verification
    - delivery-art project verification
