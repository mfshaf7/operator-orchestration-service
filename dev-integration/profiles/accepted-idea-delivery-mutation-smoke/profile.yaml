schema_version: 1
profile_id: accepted-idea-delivery-mutation-smoke
summary: Disposable local-k3s dev-integration profile for isolated accepted-idea consume and backlink smoke away from the persistent ART lane.
runtime:
  platform: local-k3s
  state_model: disposable
  namespace_pattern: devint-{profile}-{operator}
  state_root_template: .dev-integration/{profile}/{operator}
  components:
    - openproject
    - operator-orchestration-service
    - delivery-art-seeding
testing:
  smoke:
    mutation_mode: mutating
source_repos:
  - repo: operator-orchestration-service
    purpose: Broker source mount for isolated accepted-idea consume and closeout smoke.
  - repo: platform-engineering
    purpose: Reuse the canonical OpenProject backlog and delivery-project contract material.
commands:
  up: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/up.sh
  status: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/status.sh
  access: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/access.sh
  smoke: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/smoke.sh
  down: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/down.sh
  reset: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/reset.sh
  promote_check: dev-integration/profiles/accepted-idea-delivery-mutation-smoke/scripts/promote-check.sh
session:
  required_artifacts:
    - openproject-backlog.json
    - openproject-delivery-art.json
    - openproject-identity.json
    - broker.env
    - smoke-summary.txt
    - promotion-report.yaml
stage_handoff:
  owner_repo: platform-engineering
  governed_surface: openproject-stage-delivery-art-consumption
  required_checks:
    - accepted idea lookup
    - delivery-art project verification
    - consume accepted idea
    - backlink verification
