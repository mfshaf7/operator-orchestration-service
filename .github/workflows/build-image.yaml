name: Build Broker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: build-operator-orchestration-service-image
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: api-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/operator-orchestration-service
          tags: |
            type=sha,format=short,prefix=sha-

      - uses: docker/metadata-action@v5
        id: worker-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/operator-orchestration-service-worker
          tags: |
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        id: api-build
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Operator Orchestration Service
            org.opencontainers.image.description=Shared operator workflow broker and aggregate orchestration API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: docker/build-push-action@v6
        id: worker-build
        with:
          context: .
          file: ./Dockerfile
          target: orchestration-worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Operator Orchestration Service Worker
            org.opencontainers.image.description=OOS-owned durable workflow definition worker
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Smoke test API runtime
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/operator-orchestration-service@${{ steps.api-build.outputs.digest }}
        run: |
          set -euo pipefail

          cid="$(docker run -d --rm -p 18080:8080 \
            -e OPENPROJECT_BASE_URL=http://127.0.0.1:9999 \
            -e OPENPROJECT_API_TOKEN=test-token \
            -e OPENPROJECT_IDEA_TYPE_ID=1 \
            -e OPENPROJECT_CAPTURED_STATUS_ID=1 \
            -e OPENPROJECT_CUSTOM_FIELD_SOURCE_SURFACE_ID=1 \
            -e OPENPROJECT_CUSTOM_FIELD_SOURCE_REFERENCE_ID=2 \
            "${IMAGE_REF}")"

          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sleep 2
          grep -q '"status":"live"' <(wget -qO- http://127.0.0.1:18080/healthz)

      - name: Prove worker execution remains fail closed by default
        env:
          WORKER_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/operator-orchestration-service-worker@${{ steps.worker-build.outputs.digest }}
        run: |
          docker run --rm "${WORKER_IMAGE_REF}" \
            node src/orchestration-worker.js status |
            grep -q '"run_allowed": false'

      - name: Publish build summary
        run: |
          {
            echo "## Operator Orchestration Service Images"
            echo
            echo "- API: \`ghcr.io/${{ github.repository_owner }}/operator-orchestration-service@${{ steps.api-build.outputs.digest }}\`"
            echo "- Workflow worker: \`ghcr.io/${{ github.repository_owner }}/operator-orchestration-service-worker@${{ steps.worker-build.outputs.digest }}\`"
            echo "- Source SHA: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release metadata
        run: |
          cat > release-metadata.json <<EOF
          {
            "component": "operator-orchestration-service",
            "repository": "ghcr.io/${{ github.repository_owner }}/operator-orchestration-service",
            "digest": "${{ steps.api-build.outputs.digest }}",
            "artifacts": {
              "api": {
                "repository": "ghcr.io/${{ github.repository_owner }}/operator-orchestration-service",
                "digest": "${{ steps.api-build.outputs.digest }}"
              },
              "orchestrationWorker": {
                "repository": "ghcr.io/${{ github.repository_owner }}/operator-orchestration-service-worker",
                "digest": "${{ steps.worker-build.outputs.digest }}"
              }
            },
            "sourceSha": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}"
          }
          EOF

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: operator-orchestration-service-release-metadata
          path: release-metadata.json
